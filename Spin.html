<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spin The Bottle</title>

    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        font-family: Arial, sans-serif;
        color: white;
      }

      h1 {
        margin-bottom: 30px;
      }

      .circle {
        width: 300px;
        height: 300px;
        border: 8px solid white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      .bottle {
        width: 20px;
        height: 120px;
        background: #00ff88;
        border-radius: 10px;
        position: absolute;
        transform-origin: center center;
        transition: transform 4s ease-out;
      }

      .bottle::before {
        content: "";
        position: absolute;
        top: -20px;
        left: 2px;
        width: 16px;
        height: 25px;
        background: #00cc66;
        border-radius: 5px;
      }

      .pointer {
        position: absolute;
        top: -25px;
        font-size: 35px;
      }

      button {
        margin-top: 30px;
        padding: 12px 25px;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
      }

      #result {
        margin-top: 20px;
        font-size: 22px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>🎯 Spin The Bottle</h1>

    <div class="circle">
      <div class="pointer">⬇️</div>
      <div class="bottle" id="bottle"></div>
    </div>

    <button onclick="spinBottle()">SPIN</button>

    <div id="result"></div>

    <script>
      const players = [
        "Player 1 😎",
        "Player 2 😂",
        "Player 3 🤩",
        "Player 4 🥳",
        "Player 5 😏",
        "Player 6 😜",
      ];

      function spinBottle() {
        const bottle = document.getElementById("bottle");
        const result = document.getElementById("result");

        let rotation = 3600 + Math.floor(Math.random() * 360);

        bottle.style.transform = `rotate(${rotation}deg)`;

        let winner = players[Math.floor(Math.random() * players.length)];

        result.innerHTML = "";

        setTimeout(() => {
          result.innerHTML = `🍾 Bottle points to: <br><strong>${winner}</strong>`;
        }, 4000);
      }
    </script>
  </body>
</html>
